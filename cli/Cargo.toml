[package]
name = "yasumaro"
version = "6.9.69"
edition = "2021"
license = "MIT"
description = "Read-only CLI for exported Yasumaro history databases"
repository = "https://github.com/armaniacs/yasumaro"
keywords = ["sqlite", "history", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "yasumaro"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
