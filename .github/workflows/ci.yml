name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Check licenses
        run: npm run check-licenses
      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
      - name: Generate SBOM
        run: npm run generate-sbom
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
      - name: Lint
        run: npm run lint
      - name: innerHTML escape guard
        run: npm run check-innerhtml-escape
      - name: deprecated alias guard
        run: npm run check-deprecated-aliases
      - name: Type Check
        run: npm run type-check
      - name: Run Tests
        run: npm test

  gitleaks:
    # Secret scan over the full history (CI_SECURITY_CHECKLIST: .gitleaks.toml
    # existed without a wiring workflow — known gap closed here).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wasm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09)
        with:
          toolchain: stable
      - name: Cache cargo registry, build artifacts, and wasm-pack binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            wasm/js-strings/target
            wasm/pii-sanitizer/target
            wasm/textrank/target
            wasm/sentence-dedup/target
            wasm/tag-cooccur/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wasm/*/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run wasm crate Rust tests (js-strings + pii-sanitizer + textrank + sentence-dedup + tag-cooccur)
        run: npm run test:wasm
      - name: Install wasm-pack (if not cached)
        run: command -v wasm-pack || cargo install wasm-pack
      - name: Install node dependencies for parity suites
        run: npm ci
      - name: Rebuild wasm and verify behavioral equivalence with the committed one
        # Guards against a Rust source change landing without its compiled
        # output being regenerated and committed — see npm run build:wasm.
        #
        # Byte comparison across hosts is NOT achievable here: panic
        # locations embed host-specific cargo registry paths
        # (/home/runner/... vs /Users/<user>/... — even their lengths differ)
        # and wasm-bindgen-cli embeds a provenance-dependent version banner
        # into the output, so a macOS build and a CI Linux build of the same
        # source differ by ~19 bytes (verified 2026-09-19; the failing job
        # uploads its rebuilt binary for diffing). The gate therefore proves
        # BEHAVIORAL equivalence: the fresh rebuild and the committed binary
        # must each pass the full parity suite (218 captured inputs + 52
        # boundary cases + hybrid contract pins), i.e. both are equivalent
        # to the TS reference on the corpus. The committed public copy must
        # additionally be byte-identical to the committed src copy
        # (host-independent: both are committed files) — the parity suites
        # and bench read the src copy, while wxt's publicAssets hook ships
        # the public copy (wxt.config.ts); a one-sided commit must fail.
        run: |
          # PBI 2026-09-21-18: the crate list is owned by wasm/crates.json.
          # stash/restore/check derive per-crate stash copies, cmp gates
          # (publicShip crates only — the STAGED crate has no public copy)
          # and git diff staleness gates (glue always, d.ts iff dtsCopy)
          # from the manifest; red-green semantics are unchanged.
          node scripts/wasm-crates.mjs stash /tmp/wasm-gate
          npm run build:wasm
          echo "== parity suite against the FRESH rebuild =="
          npx vitest run src/wasm/pii-sanitizer/__tests__/ src/background/pipeline/__tests__/piiSanitizeHybrid.wasm-success.test.ts src/utils/__tests__/sentenceExtractorHybrid.wasm-success.test.ts src/wasm/sentence-dedup/__tests__/ src/utils/__tests__/contentDedupHybrid.wasm-success.test.ts src/wasm/tag-cooccur/__tests__/ src/dashboard/__tests__/tagCooccurrenceHybrid.wasm-success.test.ts
          node scripts/wasm-crates.mjs restore /tmp/wasm-gate
          echo "== parity suite against the COMMITTED binary =="
          npx vitest run src/wasm/pii-sanitizer/__tests__/ src/background/pipeline/__tests__/piiSanitizeHybrid.wasm-success.test.ts src/utils/__tests__/sentenceExtractorHybrid.wasm-success.test.ts src/wasm/sentence-dedup/__tests__/ src/utils/__tests__/contentDedupHybrid.wasm-success.test.ts src/wasm/tag-cooccur/__tests__/ src/dashboard/__tests__/tagCooccurrenceHybrid.wasm-success.test.ts
          node scripts/wasm-crates.mjs check /tmp/wasm-gate
      - name: Upload rebuilt wasm for cross-host diff diagnosis (on failure)
        # The byte-diff gate assumes reproducible builds across hosts. When
        # it fails, this artifact lets the maintainer diff the CI-built
        # binary against the local one and pin down the nondeterministic
        # source (toolchain, binaryen, embedded paths, ...).
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rebuilt-pii-sanitizer-bg-wasm
          path: wasm/pii-sanitizer/pkg/pii_sanitizer_bg.wasm
          if-no-files-found: ignore

  dod-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check PBI DoD
        run: node scripts/check-pbi-dod.js

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-chromium
          path: dist/
          retention-days: 7
