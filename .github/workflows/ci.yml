name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Check licenses
        run: npm run check-licenses
      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
      - name: Generate SBOM
        run: npm run generate-sbom
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
      - name: Lint
        run: npm run lint
      - name: innerHTML escape guard
        run: npm run check-innerhtml-escape
      - name: deprecated alias guard
        run: npm run check-deprecated-aliases
      - name: Type Check
        run: npm run type-check
      - name: Run Tests
        run: npm test

  wasm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (2026-09)
        with:
          toolchain: stable
      - name: Cache cargo registry, build artifacts, and wasm-pack binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            wasm/pii-sanitizer/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('wasm/pii-sanitizer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run pii-sanitizer Rust tests
        run: npm run test:wasm
      - name: Install wasm-pack (if not cached)
        run: command -v wasm-pack || cargo install wasm-pack
      - name: Rebuild wasm binary and diff against the committed one
        # Guards against a Rust source change landing without its compiled
        # output being regenerated and committed — see npm run build:wasm.
        # A rebuild diff here means someone edited wasm/pii-sanitizer/src/
        # but forgot to run `npm run build:wasm` and commit the result.
        run: |
          cp src/wasm/pii-sanitizer/pii_sanitizer_bg.wasm /tmp/committed.wasm
          npm run build:wasm
          if ! cmp -s /tmp/committed.wasm src/wasm/pii-sanitizer/pii_sanitizer_bg.wasm; then
            echo "::error::wasm binary is stale — run 'npm run build:wasm' and commit the result"
            exit 1
          fi
          git diff --exit-code src/wasm/pii-sanitizer/piiSanitizerWasm.js || \
            (echo "::error::piiSanitizerWasm.js glue is stale — run 'npm run build:wasm' and commit the result" && exit 1)

  dod-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check PBI DoD
        run: node scripts/check-pbi-dod.js

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-chromium
          path: dist/
          retention-days: 7
