name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Budget covers the store-poll worst case (CWS ~26.5 min: OAuth 30s + upload
    # 300s + 30 polls x 40s + publish 60s; Edge ~46 min: upload 300s + 2 wait
    # loops x 1200s + publish 60s) plus build headroom, so the always() store
    # steps are not killed mid-run. Normal runs finish in ~96s.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Check version consistency
        run: node scripts/check-version-consistency.js
      - name: Build for Chrome
        # OW_E2E_PROBE=0 strips the E2E probe (PBI NN08) from shipped artifacts.
        env:
          OW_E2E_PROBE: '0'
        run: npx wxt zip -b chrome
      - name: Check bundle size (M26)
        run: npm run check-bundle-size -- chrome-mv3
      - name: Sign CRX with private key
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          KEY_FILE="$(mktemp)"
          trap 'rm -f "${KEY_FILE}"' EXIT
          printf '%s\n' "${CRX_PRIVATE_KEY}" > "${KEY_FILE}"
          node scripts/build-crx3.mjs \
            "dist/yasumaro-${VERSION}-chrome.zip" \
            "${KEY_FILE}" \
            "dist/yasumaro-${VERSION}-chrome.crx"
      - name: Build for Firefox
        env:
          OW_E2E_PROBE: '0'
        run: npx wxt zip -b firefox
      - name: Check firefox bundle size
        run: npm run check-bundle-size -- firefox-mv3
      - name: Build for Edge
        env:
          OW_E2E_PROBE: '0'
        run: npx wxt zip -b edge
      - name: Check edge bundle size
        run: npm run check-bundle-size -- edge-mv3
      - name: List output archives
        run: ls -la dist/*.zip dist/*.crx
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Yasumaro v${{ steps.version.outputs.version }}

            See [CHANGELOG.md](https://github.com/armaniacs/Yasumaro/blob/main/CHANGELOG.md) for details.
          files: |
            dist/yasumaro-${{ steps.version.outputs.version }}-chrome.zip
            dist/yasumaro-${{ steps.version.outputs.version }}-chrome.crx
            dist/yasumaro-${{ steps.version.outputs.version }}-firefox.zip
            dist/yasumaro-${{ steps.version.outputs.version }}-edge.zip
          draft: false
          prerelease: false
      - name: Upload to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # Submit for review only when the repository variable is 'true'; otherwise the
          # item stays as an uploaded draft and is published manually from the dashboard.
          CWS_AUTO_PUBLISH: ${{ vars.CWS_AUTO_PUBLISH }}
          VERSION: ${{ steps.version.outputs.version }}
        # Inline shell moved to scripts/publish/cws.mjs (branches covered by
        # scripts/__tests__/publish-stores.test.ts); inputs stay on env.
        run: node scripts/publish/cws.mjs
      - name: Upload to Edge Add-ons
        # Independent of the Chrome step: a Chrome Web Store failure must not skip Edge.
        if: ${{ always() && hashFiles('dist/yasumaro-*-edge.zip') != '' }}
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          # Submit for certification only when the repository variable is 'true'; otherwise
          # the package stays in the draft submission.
          EDGE_AUTO_PUBLISH: ${{ vars.EDGE_AUTO_PUBLISH }}
          VERSION: ${{ steps.version.outputs.version }}
        # Inline shell moved to scripts/publish/edge.mjs (operation polling
        # branches covered by scripts/__tests__/publish-stores.test.ts);
        # inputs stay on env. The always()/hashFiles() gate above still keeps
        # a Chrome failure from skipping Edge.
        run: node scripts/publish/edge.mjs
      - name: Prepare AMO sources archive
        # The AMO step below is guarded on dist/yasumaro-*-sources.zip, yet no step named
        # that file: `npx wxt zip -b firefox` (Build for Firefox) writes it as a side effect,
        # because wxt enables zipSources by default for firefox and emits
        # dist/<name>-<packageVersion>-sources.zip (wxt.config.ts zip.excludeSources keeps it
        # uploadable). Making the producer explicit means a wxt default change surfaces as a
        # failed step with a message instead of a silent hashFiles() skip that never submits.
        # Only runs when AMO submission is switched on, mirroring the gate of the step below.
        if: ${{ vars.AMO_AUTO_SUBMIT == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Same strip flag as the release builds, so a regenerated archive matches them.
          OW_E2E_PROBE: '0'
        # Inline shell moved to scripts/publish/amo-prepare-sources.mjs
        # (covered by scripts/__tests__/publish-stores.test.ts); inputs stay on env.
        run: node scripts/publish/amo-prepare-sources.mjs
      - name: Submit to Firefox Add-ons (AMO)
        # AMO has no draft state: a listed-channel upload is a submission for review, so the
        # whole step is gated on the repository variable. Independent of the other store steps.
        # hashFiles() guard: the archive is produced by 'Prepare AMO sources archive' above,
        # which fails loudly instead of leaving this guard to skip on its own.
        if: ${{ always() && hashFiles('dist/yasumaro-*-sources.zip') != '' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_AUTO_SUBMIT: ${{ vars.AMO_AUTO_SUBMIT }}
          VERSION: ${{ steps.version.outputs.version }}
        # Inline shell moved to scripts/publish/amo-submit.mjs (the
        # AMO_AUTO_SUBMIT gate and the web-ext sign invocation live there,
        # covered by scripts/__tests__/publish-stores.test.ts); inputs stay on env.
        run: node scripts/publish/amo-submit.mjs

  record-metrics:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Record and commit project metrics
        continue-on-error: true
        env:
          # Workflow context values must reach the shell via env, never by
          # direct ${{ }} expansion inside run: — a crafted ref name could
          # otherwise inject shell commands (CI_SECURITY_CHECKLIST rule).
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/metrics/updateHistory.mjs "$REF_NAME"
          git add dev-docs/metrics/history.json
          git commit -m "chore(metrics): record $REF_NAME growth metrics" || { echo "No changes to commit"; exit 0; }
          git push origin main
