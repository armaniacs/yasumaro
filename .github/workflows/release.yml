name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Check version consistency
        run: node scripts/check-version-consistency.js
      - name: Build for Chrome
        # OW_E2E_PROBE=0 strips the E2E probe (PBI NN08) from shipped artifacts.
        env:
          OW_E2E_PROBE: '0'
        run: npx wxt zip -b chrome
      - name: Check bundle size (M26)
        run: npm run check-bundle-size -- chrome-mv3
      - name: Sign CRX with private key
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          KEY_FILE="$(mktemp)"
          trap 'rm -f "${KEY_FILE}"' EXIT
          printf '%s\n' "${CRX_PRIVATE_KEY}" > "${KEY_FILE}"
          node .github/workflows/build-crx3.mjs \
            "dist/yasumaro-${VERSION}-chrome.zip" \
            "${KEY_FILE}" \
            "dist/yasumaro-${VERSION}-chrome.crx"
      - name: Build for Firefox
        env:
          OW_E2E_PROBE: '0'
        run: npx wxt zip -b firefox
      - name: Check firefox bundle size
        run: npm run check-bundle-size -- firefox-mv3
      - name: Build for Edge
        env:
          OW_E2E_PROBE: '0'
        run: npx wxt zip -b edge
      - name: List output archives
        run: ls -la dist/*.zip dist/*.crx
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Yasumaro v${{ steps.version.outputs.version }}

            See [CHANGELOG.md](https://github.com/armaniacs/Yasumaro/blob/main/CHANGELOG.md) for details.
          files: |
            dist/yasumaro-${{ steps.version.outputs.version }}-chrome.zip
            dist/yasumaro-${{ steps.version.outputs.version }}-chrome.crx
            dist/yasumaro-${{ steps.version.outputs.version }}-firefox.zip
            dist/yasumaro-${{ steps.version.outputs.version }}-edge.zip
          draft: false
          prerelease: false
      - name: Upload to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # Submit for review only when the repository variable is 'true'; otherwise the
          # item stays as an uploaded draft and is published manually from the dashboard.
          CWS_AUTO_PUBLISH: ${{ vars.CWS_AUTO_PUBLISH }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ITEM_PATH="publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}"

          ACCESS_TOKEN=$(curl -sS --connect-timeout 10 --max-time 30 https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=${CHROME_CLIENT_ID}" \
            --data-urlencode "client_secret=${CHROME_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${CHROME_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token" | jq -r '.access_token // empty')
          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "OAuth token refresh failed"
            exit 1
          fi
          echo "::add-mask::${ACCESS_TOKEN}"

          UPLOAD_RESP=$(curl -sS --connect-timeout 10 --max-time 300 -X POST \
            "https://chromewebstore.googleapis.com/upload/v2/${ITEM_PATH}:upload" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "X-Goog-Upload-Protocol: raw" \
            -H "X-Goog-Upload-File-Name: extension.crx" \
            -T "dist/yasumaro-${VERSION}-chrome.crx")
          UPLOAD_STATE=$(echo "${UPLOAD_RESP}" | jq -r '.uploadState // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)
          echo "Upload: ${UPLOAD_STATE}"
          if [ "${UPLOAD_STATE}" = "UNKNOWN" ]; then
            echo "Upload response (error fields only):"
            echo "${UPLOAD_RESP}" | jq -c '{error: (.error // null), status: .status, message: .message}' 2>/dev/null \
              || echo "Non-JSON response (${#UPLOAD_RESP} bytes)"
          fi

          # NOT_FOUND is returned until the async upload is registered, so it is polled like IN_PROGRESS.
          for i in $(seq 1 30); do
            case "${UPLOAD_STATE}" in IN_PROGRESS|NOT_FOUND) ;; *) break ;; esac
            sleep 10
            UPLOAD_STATE=$(curl -sS --connect-timeout 10 --max-time 30 \
              "https://chromewebstore.googleapis.com/v2/${ITEM_PATH}:fetchStatus" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" | jq -r '.lastAsyncUploadState // "UNKNOWN"')
            echo "Upload status check ${i}/30: ${UPLOAD_STATE}"
          done

          if [ "${UPLOAD_STATE}" != "SUCCEEDED" ]; then
            echo "Upload failed with state: ${UPLOAD_STATE}"
            exit 1
          fi

          if [ "${CWS_AUTO_PUBLISH}" != "true" ]; then
            echo "CWS_AUTO_PUBLISH is not 'true'; skipping publish"
            exit 0
          fi

          PUBLISH_ERROR=$(curl -sS --connect-timeout 10 --max-time 60 -X POST \
            "https://chromewebstore.googleapis.com/v2/${ITEM_PATH}:publish" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' | jq -r '.error.message // empty')
          if [ -n "${PUBLISH_ERROR}" ]; then
            echo "Publish failed: ${PUBLISH_ERROR}"
            exit 1
          fi
          echo "Publish submitted"
      - name: Upload to Edge Add-ons
        # Independent of the Chrome step: a Chrome Web Store failure must not skip Edge.
        if: ${{ always() && hashFiles('dist/yasumaro-*-edge.zip') != '' }}
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          # Submit for certification only when the repository variable is 'true'; otherwise
          # the package stays in the draft submission.
          EDGE_AUTO_PUBLISH: ${{ vars.EDGE_AUTO_PUBLISH }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          API="https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}"
          AUTH=(-H "Authorization: ApiKey ${EDGE_API_KEY}" -H "X-ClientID: ${EDGE_CLIENT_ID}")
          HEADERS_FILE="$(mktemp)"
          trap 'rm -f "${HEADERS_FILE}"' EXIT

          # Prints "Succeeded" once the operation finishes; any other terminal status fails the step.
          wait_for_operation() {
            local url="$1" label="$2" status resp
            for i in $(seq 1 30); do
              resp=$(curl -sS --connect-timeout 10 --max-time 30 "${AUTH[@]}" "${url}")
              status=$(echo "${resp}" | jq -r '.status // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)
              echo "${label} status check ${i}/30: ${status}"
              if [ "${status}" = "Succeeded" ]; then return 0; fi
              if [ "${status}" != "InProgress" ]; then
                echo "${label} failed:"
                echo "${resp}" | jq -c '{status, errorCode, message}' 2>/dev/null || echo "Non-JSON response"
                return 1
              fi
              sleep 10
            done
            echo "${label} did not finish in time"
            return 1
          }

          operation_id() {
            grep -i '^location:' "${HEADERS_FILE}" | tr -d '\r' | awk '{print $2}' | awk -F/ '{print $NF}'
          }

          HTTP=$(curl -sS --connect-timeout 10 --max-time 300 -X POST \
            -D "${HEADERS_FILE}" -o /dev/null -w '%{http_code}' \
            "${AUTH[@]}" -H "Content-Type: application/zip" \
            -T "dist/yasumaro-${VERSION}-edge.zip" \
            "${API}/submissions/draft/package")
          echo "Upload: HTTP ${HTTP}"
          if [ "${HTTP}" != "202" ]; then
            echo "Edge upload was not accepted"
            exit 1
          fi
          OP=$(operation_id)
          [ -n "${OP}" ] || { echo "No operation id in Location header"; exit 1; }
          wait_for_operation "${API}/submissions/draft/package/operations/${OP}" "Upload"

          if [ "${EDGE_AUTO_PUBLISH}" != "true" ]; then
            echo "EDGE_AUTO_PUBLISH is not 'true'; skipping publish"
            exit 0
          fi

          HTTP=$(curl -sS --connect-timeout 10 --max-time 60 -X POST \
            -D "${HEADERS_FILE}" -o /dev/null -w '%{http_code}' \
            "${AUTH[@]}" -H "Content-Type: application/json" \
            -d "{\"notes\":\"Automated release v${VERSION}\"}" \
            "${API}/submissions")
          echo "Publish: HTTP ${HTTP}"
          if [ "${HTTP}" != "202" ]; then
            echo "Edge publish was not accepted"
            exit 1
          fi
          OP=$(operation_id)
          [ -n "${OP}" ] || { echo "No operation id in Location header"; exit 1; }
          wait_for_operation "${API}/submissions/operations/${OP}" "Publish"
          echo "Publish submitted"
      - name: Submit to Firefox Add-ons (AMO)
        # AMO has no draft state: a listed-channel upload is a submission for review, so the
        # whole step is gated on the repository variable. Independent of the other store steps.
        if: ${{ always() && hashFiles('dist/yasumaro-*-sources.zip') != '' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_AUTO_SUBMIT: ${{ vars.AMO_AUTO_SUBMIT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${AMO_AUTO_SUBMIT}" != "true" ]; then
            echo "AMO_AUTO_SUBMIT is not 'true'; skipping AMO submission"
            exit 0
          fi
          ARTIFACTS_DIR="$(mktemp -d)"
          # The reviewer rebuilds from the sources archive, so it must travel with the bundle.
          # --approval-timeout 0: review is manual and takes days; do not hold the runner.
          npx --yes --package web-ext@10.7.0 web-ext sign \
            --channel listed \
            --source-dir dist/firefox-mv3 \
            --artifacts-dir "${ARTIFACTS_DIR}" \
            --upload-source-code "dist/yasumaro-${VERSION}-sources.zip" \
            --approval-timeout 0 \
            --no-input

  record-metrics:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Record and commit project metrics
        continue-on-error: true
        env:
          # Workflow context values must reach the shell via env, never by
          # direct ${{ }} expansion inside run: — a crafted ref name could
          # otherwise inject shell commands (CI_SECURITY_CHECKLIST rule).
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/metrics/updateHistory.mjs "$REF_NAME"
          git add dev-docs/metrics/history.json
          git commit -m "chore(metrics): record $REF_NAME growth metrics" || { echo "No changes to commit"; exit 0; }
          git push origin main
