name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=$(echo "$VERSION" | cut -d. -f2)" >> $GITHUB_OUTPUT
      - name: Check if minor version is even
        id: minor_check
        run: |
          MINOR="${{ steps.version.outputs.minor }}"
          if [ $((MINOR % 2)) -eq 0 ]; then
            echo "is_even=true" >> $GITHUB_OUTPUT
          else
            echo "is_even=false" >> $GITHUB_OUTPUT
          fi
          echo "Minor version: ${MINOR} (even: $((MINOR % 2 == 0)))"
      - name: Build for Chrome
        run: npx wxt zip -b chrome
      - name: Check bundle size (M26)
        run: npm run check-bundle-size -- chrome-mv3
      - name: Sign CRX with private key
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "${CRX_PRIVATE_KEY}" > /tmp/private.pem
          node .github/workflows/build-crx3.mjs \
            "dist/yasumaro-${VERSION}-chrome.zip" \
            /tmp/private.pem \
            "dist/yasumaro-${VERSION}-chrome.crx"
          rm /tmp/private.pem
      - name: Build for Firefox
        run: npx wxt zip -b firefox
      - name: Build for Edge
        run: npx wxt zip -b edge
      - name: List output archives
        run: ls -la dist/*.zip dist/*.crx
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Yasumaro v${{ steps.version.outputs.version }}

            See [CHANGELOG.md](https://github.com/armaniacs/Yasumaro/blob/main/CHANGELOG.md) for details.
          files: |
            dist/yasumaro-${{ steps.version.outputs.version }}-chrome.zip
            dist/yasumaro-${{ steps.version.outputs.version }}-chrome.crx
            dist/yasumaro-${{ steps.version.outputs.version }}-firefox.zip
            dist/yasumaro-${{ steps.version.outputs.version }}-edge.zip
          draft: false
          prerelease: false

      - name: Publish to Chrome Web Store
        if: steps.minor_check.outputs.is_even == 'true'
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FULL_RESP=$(curl -s --connect-timeout 10 --max-time 30 -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CHROME_CLIENT_ID}&client_secret=${CHROME_CLIENT_SECRET}&refresh_token=${CHROME_REFRESH_TOKEN}&grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "${FULL_RESP}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "Auth failed. Error details:"
            echo "${FULL_RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); [d.pop(k,None) for k in ('access_token','refresh_token','client_secret','id_token')]; print(f\"Error: {d['error']}\") if 'error' in d else None; print(f\"Description: {d['error_description']}\") if 'error_description' in d else None; print(f\"URI: {d['error_uri']}\") if 'error_uri' in d else None; print('Unknown error - response sanitized') if not any(k in d for k in ('error','error_description','error_uri')) else None" 2>/dev/null || echo 'Failed to parse error response'
            exit 1
          fi

          CRX_FILE="dist/yasumaro-${VERSION}-chrome.crx"
          ITEM_PATH="publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}"

          UPLOAD_RESP=$(curl -s --connect-timeout 10 --max-time 300 -X POST \
            "https://chromewebstore.googleapis.com/upload/v2/${ITEM_PATH}:upload" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "X-Goog-Upload-Protocol: raw" \
            -H "X-Goog-Upload-File-Name: extension.crx" \
            -T "${CRX_FILE}")
          UPLOAD_STATUS=$(echo "${UPLOAD_RESP}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('uploadState','UNKNOWN'))")
          echo "Upload: ${UPLOAD_STATUS}"

          if [ "${UPLOAD_STATUS}" = "IN_PROGRESS" ]; then
            for i in {1..30}; do
              sleep 10
              STATUS_RESP=$(curl -s --connect-timeout 10 --max-time 30 -X GET \
                "https://chromewebstore.googleapis.com/v2/${ITEM_PATH}" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}")
              UPLOAD_STATUS=$(echo "${STATUS_RESP}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('uploadState','UNKNOWN'))")
              echo "Upload status check ${i}/30: ${UPLOAD_STATUS}"
              if [ "${UPLOAD_STATUS}" != "IN_PROGRESS" ]; then
                break
              fi
            done
          fi

          if [ "${UPLOAD_STATUS}" != "SUCCEEDED" ]; then
            echo "Upload failed with status: ${UPLOAD_STATUS}"
            echo "${UPLOAD_RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); [d.pop(k,None) for k in ('access_token','refresh_token','client_secret','id_token')]; print(json.dumps(d,indent=2))" 2>/dev/null || echo "${UPLOAD_RESP}"
            exit 1
          fi

          PUBLISH_RESP=$(curl -s --connect-timeout 10 --max-time 60 -X POST \
            "https://chromewebstore.googleapis.com/v2/${ITEM_PATH}:publish" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}')
          echo "Publish response received"
          PUBLISH_ERROR=$(echo "${PUBLISH_RESP}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error',{}).get('message','')) if isinstance(d, dict) else print('')" 2>/dev/null || echo '')
          if [ -n "${PUBLISH_ERROR}" ]; then
            echo "Publish failed: ${PUBLISH_ERROR}"
            exit 1
          fi
          echo "✅ Published"

      - name: Record and commit project metrics
        continue-on-error: true
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/metrics/updateHistory.mjs ${{ github.ref_name }}
          git add dev-docs/metrics/history.json
          git commit -m "chore(metrics): record ${{ github.ref_name }} growth metrics" || { echo "No changes to commit"; exit 0; }
          git push origin main
