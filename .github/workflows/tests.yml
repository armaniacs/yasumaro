name: Tests

on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'npm' }

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run build

      - name: Accessibility checks (axe-core)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test --config testDir/playwright.config.ts --grep @a11y

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-a11y-report
          path: playwright-report/
          retention-days: 7

  usability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'npm' }

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run build

      - name: Usability checks (navigation, task-flows, a11y, i18n, friction budget)
        run: npm run test:e2e:usability:ci

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-usability-report
          path: playwright-report/
          retention-days: 7

  firefox-storage:
    # Firefox ストレージパイプラインの回帰検知（PBI 2026-09-14-10）:
    # 実 dist 成果物（opfs-worker.js + wasm 公開アセット）を http origin で
    # 駆動する probe と worker smoke。拡張インストール自体は Playwright が
    # Firefox をサポートしないため手動 QA（PBI 11 のチェックリスト）。
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'npm' }

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox

      - name: Build extension (firefox)
        run: npm run build:firefox

      - name: Firefox storage + PII WASM probes (VFS probe + worker smoke + wasm core)
        run: npx playwright test --config testDir/playwright.config.ts --project=firefox e2e/firefox-opfs-probe.spec.ts e2e/firefox-worker-smoke.spec.ts e2e/firefox-pii-wasm-probe.spec.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-firefox-storage-report
          path: playwright-report/
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: 'npm' }

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run build

      - name: Generate dev-server TLS certificate (gitignored fixture)
        run: openssl req -x509 -newkey rsa:2048 -keyout testDir/e2e/fixtures/dev-server-key.pem -out testDir/e2e/fixtures/dev-server-cert.pem -days 3650 -nodes -subj "/CN=localhost"

      - name: Extension E2E tests
        id: e2e
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test --config testDir/playwright.config.ts --grep @extension

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.startsWith('### Validation Results')
            );

            const e2eOk = process.env.E2E_OUTCOME === 'success';
            const result = e2eOk ? '✅ All checks passed!' : '❌ Some checks failed.';

            const body = [
              '### Validation Results',
              '',
              '**Status:** ' + result,
              '',
              '| Check | Status |',
              '|-------|--------|',
              '| Extension E2E | ' + process.env.E2E_OUTCOME + ' |',
              '',
              '(Lint / type-check / unit tests run in the CI workflow; see checks list.)',
              '',
              '[View details in the logs](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')',
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
