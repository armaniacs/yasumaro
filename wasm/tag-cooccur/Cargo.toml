[package]
name = "tag-cooccur"
version = "0.1.0"
edition = "2021"
description = "Tag cooccurrence core for Yasumaro dashboards, compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# SSOT for the JS `\s` member set (PBI 2026-09-21-24): is_js_space delegates
# to js-strings so a `\s` correction lands in one crate for all cores.
js-strings = { path = "../js-strings" }
# FxHash for the node/edge maps: the default SipHash RandomState re-seeds
# every map and hashes String keys byte-wise, which dominates the O(T^2)
# pair scan. FxHash is deterministic and only the hasher changes, never the
# keys, so the computed counts (and therefore the output) are identical to
# the TS reference either way.
rustc-hash = "2"

[profile.release]
# Compute-heavy crate (O(T^2) pair scan over tag sets per record), unlike
# the size-optimized pii-sanitizer: full optimization beats opt-level "z"
# because only a small string table plus integer arrays cross back to JS.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
