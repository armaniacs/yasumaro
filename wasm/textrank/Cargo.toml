[package]
name = "textrank"
version = "0.1.0"
edition = "2021"
description = "TextRank sentence extraction core for Yasumaro, compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# Shared JS string semantics (whitespace, lowercase, bigrams, Jaccard);
# the textrank parameterization (no trailing-delimiter strip, bigrams from
# the lowered text) is selected at the call site via TEXTRANK_TOKENIZE.
js-strings = { path = "../js-strings" }

[profile.release]
# Compute-heavy crate (O(n^2) similarity matrix + PageRank iterations), unlike
# the size-optimized pii-sanitizer: full optimization beats opt-level "z" here
# because the extracted-sentence indices returned to JS are tiny regardless.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
