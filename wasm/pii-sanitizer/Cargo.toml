[package]
name = "pii-sanitizer"
version = "0.1.0"
edition = "2021"
description = "PII detection/masking core for Yasumaro, compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
# The js_ws_len byte-width matcher is exhaustively tested against the
# canonical JS `\s` set owned by the shared crate (PBI 2026-09-21-24).
js-strings = { path = "../js-strings" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
