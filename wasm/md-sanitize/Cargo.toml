[package]
name = "md-sanitize"
version = "0.1.0"
edition = "2021"
description = "Markdown sanitization core for Yasumaro exports, compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
# String-scan heavy crate (per-entry regex-chain replacement), mirroring the
# tag-cooccur precedent: full optimization beats opt-level "z" because only
# strings cross back to JS and the scan itself dominates.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
