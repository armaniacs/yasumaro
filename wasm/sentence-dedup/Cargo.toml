[package]
name = "sentence-dedup"
version = "0.1.0"
edition = "2021"
description = "Sentence-level redundancy reduction core for Yasumaro, compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# Shared JS string semantics (whitespace, lowercase, bigrams, Jaccard) with
# the FxHash word-set policy; the dedup parameterization (strip one trailing
# delimiter, bigrams from the original-case text) is selected at the call
# site via DEDUP_TOKENIZE.
js-strings = { path = "../js-strings" }

[profile.release]
# Compute-heavy crate (O(n^2) Jaccard pair scan over word sets), unlike the
# size-optimized pii-sanitizer: full optimization beats opt-level "z" because
# the kept-sentence indices returned to JS are tiny regardless.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
