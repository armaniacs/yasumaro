[package]
name = "sentence-dedup"
version = "0.1.0"
edition = "2021"
description = "Sentence-level redundancy reduction core for Yasumaro, compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# FxHash for the word sets: the default SipHash RandomState re-seeds every
# per-sentence set and hashes Vec<u16> keys byte-wise, which dominates the
# O(n^2) Jaccard pair scan. FxHash is deterministic and collision behavior
# is irrelevant here — only the hasher changes, never the keys, so the
# computed Jaccard values (and therefore the output) are bit-identical to
# the TS reference either way.
rustc-hash = "2"

[profile.release]
# Compute-heavy crate (O(n^2) Jaccard pair scan over word sets), unlike the
# size-optimized pii-sanitizer: full optimization beats opt-level "z" because
# the kept-sentence indices returned to JS are tiny regardless.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
